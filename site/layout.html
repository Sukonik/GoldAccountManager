<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · GoldAccountManager</title>
<meta name="description" content="{{.Description}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/blue-bolt.css">
<script src="assets/blue-bolt.js"></script>
</head>
<body>
<a class="bb-skip" href="#main">Skip to content</a>
<header class="bb-header">
  <div class="bb-container bb-header__in">
    <a class="bb-brand" href="index.html">
      <span class="bb-brand__mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 32 32"><path d="M18.5 4 8 18h7l-1.5 10L24 14h-7z" fill="currentColor"/></svg></span>
      GoldAccountManager
    </a>
    <nav class="bb-nav" aria-label="Main">
      {{range .Nav}}<a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>
      {{end}}
    </nav>
    <button type="button" class="bb-theme" data-bb-theme-toggle>Theme: auto</button>
  </div>
</header>
<main id="main">
  <div class="bb-container">
{{.Content}}
  </div>
</main>
<footer class="bb-footer">
  <div class="bb-container">
    <p>GoldAccountManager is open source under the <a href="https://github.com/Sukonik/GoldAccountManager/blob/main/LICENSE">Mozilla Public License 2.0</a>.
    The UI is <a href="blue-bolt.html">Blue Bolt UI</a>. <a href="https://github.com/Sukonik/GoldAccountManager">Source on GitHub</a>.
    Site version <a href="versions.html">{{.Version}}</a>.</p>
  </div>
</footer>
</body>
</html>
